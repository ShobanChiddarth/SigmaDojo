services:
  backend:
    image: shobanchiddarth/sigmadojo-backend:1.1.0
    container_name: sigmadojo-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./log-datasets:/log-datasets
    environment:
      FRONTEND: "http://localhost:3000"
      LOG_DATASETS_PATH: "/log-datasets"
      LOGFILES: '["https://github.com/EdgeRunners-BrewingSec/log-datasets/releases/download/v1.0.0/sysmon.ndjson","https://github.com/EdgeRunners-BrewingSec/log-datasets/releases/download/v1.0.0/web_access.ndjson","https://github.com/EdgeRunners-BrewingSec/log-datasets/releases/download/v1.0.0/windows_security.ndjson"]'
    restart: unless-stopped

  frontend:
    image: shobanchiddarth/sigmadojo-frontend:1.1.0
    container_name: sigmadojo-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - VITE_BACKEND_URL=http://127.0.0.1:8000
    restart: unless-stopped
